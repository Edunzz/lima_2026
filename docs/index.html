<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guía de laboratorio — Lima 2026</title>
  <meta name="description" content="Guía del laboratorio Lima 2026: observabilidad agéntica con Dynatrace, dtctl y GitHub Copilot.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231496FF'/></svg>">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script>
    // Antes de pintar: evita el destello en claro al abrir en modo oscuro.
    try {
      var guardado = localStorage.getItem('lima2026:theme:v1');
      if (guardado === 'dark' || guardado === 'light') {
        document.documentElement.setAttribute('data-theme', guardado);
      }
    } catch (e) { /* sin localStorage: manda la preferencia del sistema */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#panelBody">Saltar al contenido del paso</a>

  <header class="topbar">
    <div class="topbar__title">
      <span id="labTitle">Cargando…</span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="sectionTitle" class="muted"></span>
    </div>
    <div class="topbar__right">
      <button id="flowToggle" class="btn btn--steps" type="button"
              aria-expanded="false" aria-controls="flow">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span id="flowToggleLabel">Pasos</span>
      </button>
      <nav class="topbar__links" id="topbarLinks" aria-label="Enlaces del laboratorio"></nav>
      <div class="progress" role="progressbar" aria-label="Progreso del laboratorio"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress__bar" id="progressBar"></div>
      </div>
      <span id="progressLabel" class="muted">0/0</span>
      <label class="switch" title="Recarga la guía automáticamente al editar steps.md">
        <input type="checkbox" id="autoReload">
        <svg class="icon switch__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg><span class="switch__text">Auto-recarga</span>
      </label>
      <button id="themeToggle" class="btn btn--icon" type="button"
              aria-pressed="false" title="Cambiar a modo oscuro">
<svg class="icon icon--luna" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon icon--sol" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="sr-only" id="themeLabel">Cambiar a modo oscuro</span>
      </button>
      <button id="resetProgress" class="btn btn--ghost" type="button" title="Reiniciar el progreso">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L3 8"/></svg><span class="btn__text">Reiniciar</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="flow" id="flow" aria-label="Flujo del laboratorio">
      <div class="flow__canvas">
        <svg class="flow__links" id="flowLinks" aria-hidden="true" focusable="false"></svg>
        <div class="flow__nodes" id="flowNodes"></div>
      </div>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Ajustar el ancho de los paneles (flechas ← → para mover, doble clic para reiniciar)"
         aria-valuemin="28" aria-valuemax="80" aria-valuenow="62"></div>

    <aside class="panel" id="panel">
      <div class="panel__body" id="panelBody" tabindex="-1" aria-live="polite">
        <h1 class="panel__title" id="panelTitle"></h1>
        <div class="panel__content markdown-body" id="panelContent">
          <p class="muted">Cargando <code>steps.md</code>…</p>
        </div>
      </div>
      <div class="panel__footer" id="panelFooter" hidden>
        <button class="btn btn--secondary" id="prevBtn" type="button">← Anterior</button>
        <button class="btn btn--primary" id="completeBtn" type="button" aria-pressed="false">Marcar como completado</button>
        <button class="btn btn--secondary" id="nextBtn" type="button">Siguiente →</button>
      </div>
    </aside>
  </main>

  <div class="lightbox" id="lightbox" hidden tabindex="-1" role="dialog" aria-label="Imagen ampliada — pulsa Escape para cerrar">
    <img id="lightboxImg" alt="">
  </div>

  <noscript>
    <p class="notice notice--error">
      Esta guía necesita JavaScript. Puedes leer el contenido directamente en
      <a href="./steps.md">steps.md</a>.
    </p>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
